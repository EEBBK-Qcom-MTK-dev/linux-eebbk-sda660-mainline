name: personal dtb-main
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:

jobs:
  dbts-check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62
        with:
          files: |
            **.yaml
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -yqq bison build-essential device-tree-compiler flex gcc-aarch64-linux-gnu python3 python3-dev python3-venv swig
      - name: Install dependencies2
        run: |
          python -m pip install --upgrade pip setuptools wheel
          RUAMEL_NO_PIP_INSTALL_CLIBZ=1 pip install ruamel.yaml
          pip install dtschema          
      - name: Prepare build direcotory
        run: |
          mkdir build-dtbs-check
      - name: Prepare config
        run: |
          make O=build-dtbs-check ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig sdm660_defconfig
      - name: Compile DTBs
        run: |
          make O=build-dtbs-check ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- dtbs
      - name: Upload DTBs
        uses: actions/upload-artifact@v4
        with:
          name: DTBs
          path:
             build-dtbs-check/arch/arm64/boot/dts/qcom/*.dtb
      - name: Create venv
        run: |
          python3 -m venv venv_dtschema
          . venv_dtschema/bin/activate
          pip3 install dtschema yamllint
          deactivate
      - name: Check DTBs
        run: |
          . venv_dtschema/bin/activate
          make O=build-dtbs-check ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j1 CHECK_DTBS=y \
              qcom/sda660-*.dtb 2>&1 | \
              tee build-dtbs-check/results.txt
          deactivate
      - name: Check bindings
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          CHANGED_YAMLS: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          . venv_dtschema/bin/activate
          # echo "CHANGED_YAMLS: ${CHANGED_YAMLS}"
          if [ ! -z "${CHANGED_YAMLS}" ]; then
              for f in ${CHANGED_YAMLS}; do
                  bf=$( basename $f )
                  echo "==> Checking binding: $bf"
                  make dt_binding_check O=build-dtbs-check ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j1 "DT_SCHEMA_FILES=$bf"
              done
          fi
          deactivate
      - name: Cleanup venv
        run: |
          rm -r venv_dtschema
      - name: Analyze results
        continue-on-error: true
        run: |
          python3 .github/workflows/analyze_dtbs_check.py build-dtbs-check/results.txt
