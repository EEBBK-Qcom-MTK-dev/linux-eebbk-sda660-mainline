name: build
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - qcom-sdm660-6.*.y
    tags:
      - v*-sdm660
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -yqq bison build-essential device-tree-compiler flex gcc-aarch64-linux-gnu python3 python3-dev python3-venv swig
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc
      - name: Prepare build direcotory
        run: |
          mkdir output
      - name: Prepare config
        run: |
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- sdm660_defconfig
      - name: Compile kernel
        run: |
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 Image.gz
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- dtbs

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: out/arch/arm64/boot/Image.gz

      - name: Upload panel modules
        uses: actions/upload-artifact@v4
        with:
          name: panel
          path: out/drivers/gpu/drm/panel/panel-truly-nt35597.o
