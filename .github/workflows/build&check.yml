name: build
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - qcom-sdm660-6.*.y
    tags:
      - v*-sdm660
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -yqq bison build-essential device-tree-compiler flex gcc-aarch64-linux-gnu python3 python3-dev python3-venv swig
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc
      - name: Prepare config
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- sdm660_defconfig
      - name: Compile kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2
      - name: Install modules
        run: |
          mkdir -p out/modules
          make modules_install INSTALL_MOD_PATH=out/modules

      - name: Package
        run: |
          cp .config out/
          cp -r arch/arm64/boot out/
          tar -Jcvf out.tar.xz out

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: out.tar.xz
          if-no-files-found: error
