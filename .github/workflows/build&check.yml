name: build
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - qcom-sdm660-6.*.y
    tags:
      - v*-sdm660
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -yqq bison build-essential device-tree-compiler flex gcc-aarch64-linux-gnu python3 python3-dev python3-venv swig
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc
      - name: Prepare build direcotory
        run: |
          mkdir output
      - name: Prepare config
        run: |
          make O=output ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- sdm660_defconfig
      - name: Compile kernel
        run: |
          make O=output ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 Image.gz
          make O=output ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 modules
          make O=output ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- dtbs

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: output/arch/arm64/boot/Image.gz

      - name: Package artifacts
        run: tar -czf release-assets.tar.gz output/

      # 4. 创建Release
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 使用内置令牌
        with:
          tag_name: ${{ github.ref_name }} # 使用触发工作流的标签名
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') }} # 如果标签包含-alpha或-beta，则标记为预发布

      # 5. 上传打包好的文件到Release
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # 来自上一步的输出
          asset_path: ./release-assets.tar.gz
          asset_name: build-artifacts-${{ github.ref_name }}.tar.gz
          asset_content_type: application/gzip
